<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BARBER RESERVE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --gold:#D4AF37; --bg:#111; --card:#1c1c1c; --box:#252525; --line:#333; --white:#fff; --gray:#aaa; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif; }
  body { background:var(--bg); color:var(--white); min-height:100vh; padding:40px 16px 60px; }
  .container { max-width:560px; margin:0 auto; }
  [dir="rtl"] { text-align:right; }
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .logo { color:var(--gold); font-size:26px; font-weight:bold; }
  .subtitle { color:var(--gray); font-size:14px; margin-top:6px; }
  .admin-trigger { background:var(--box); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; font-size:16px; color:var(--white); }
  .card { background:var(--card); border-radius:20px; padding:22px; margin-bottom:40px; }
  .lang-box { background:var(--box); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; margin-bottom:5px; width:100%; color:var(--white); font-size:15px; }
  .lang-box .gold { color:var(--gold); font-weight:bold; }
  .gray { color:var(--gray); }
  .language-menu { margin-bottom:10px; }
  .language-item { display:block; width:100%; text-align:start; padding:12px; background:var(--box); margin-top:3px; border-radius:8px; color:var(--white); border:none; cursor:pointer; font-size:15px; }
  .hero-image { width:100%; height:220px; object-fit:cover; border-radius:14px; margin-top:15px; }
  .barber-name { color:var(--white); font-size:24px; font-weight:bold; margin-top:15px; }
  .location { color:var(--gray); font-size:14px; margin-top:6px; }
  .line { height:1px; background:var(--line); margin:22px 0; }
  .section-title { color:var(--white); font-size:19px; font-weight:bold; margin-bottom:15px; }
  .section-title-small { color:var(--white); font-size:18px; font-weight:bold; margin:10px 0 12px; }
  .item { background:var(--box); border-radius:12px; padding:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; border:1.5px solid transparent; cursor:pointer; width:100%; color:var(--white); text-align:start; }
  .item.active { border-color:var(--gold); background:#2d2d2d; }
  .service-name { font-size:16px; font-weight:600; }
  .service-time { color:#888; font-size:13px; margin-top:4px; }
  .price { color:var(--gold); font-size:18px; font-weight:bold; }
  .working-hours { color:#777; font-size:12px; text-align:center; margin-top:8px; }
  .btn { background:var(--gold); color:#111; border:none; padding:17px; border-radius:12px; width:100%; margin-top:25px; font-size:14px; font-weight:bold; cursor:pointer; }
  .btn.disabled { opacity:.5; }
  .btn-secondary { background:var(--box); border:1.5px solid var(--gold); color:var(--gold); padding:16px; border-radius:12px; width:100%; font-size:15px; font-weight:bold; cursor:pointer; text-align:center; margin-top:10px; }
  .back { color:var(--gold); font-size:15px; margin-bottom:15px; font-weight:600; background:none; border:none; cursor:pointer; }
  .input { background:var(--box); color:var(--white); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; width:100%; font-size:16px; }
  .input::placeholder { color:#666; }
  .month-box { background:var(--box); border:1px solid var(--line); border-radius:12px; padding:12px 15px; margin-bottom:10px; text-align:center; color:var(--gold); font-size:16px; font-weight:bold; }
  .days-scroll { display:flex; overflow-x:auto; padding:5px 2px; gap:8px; }
  .day-box { min-width:70px; height:78px; background:var(--box); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1.5px solid transparent; cursor:pointer; }
  .day-box.active { border-color:var(--gold); background:#2d2d2d; }
  .day-box.holiday { border-color:#7a3333; background:#292020; }
  .day-box.holiday-selected { border-color:var(--gold); background:#302c1d; }
  .day-name { color:var(--gray); font-size:12px; font-weight:600; margin-bottom:5px; }
  .day-number { color:var(--white); font-size:20px; font-weight:bold; }
  .day-box.active .day-name, .day-box.active .day-number, .day-box.holiday-selected .day-name, .day-box.holiday-selected .day-number { color:var(--gold); }
  .holiday-mini { font-size:10px; margin-top:3px; }
  .holiday-message { background:#2b2020; border:1px solid #6b3535; border-radius:12px; padding:14px; margin-top:12px; color:#ffb0b0; font-size:13px; line-height:20px; text-align:center; font-weight:600; }
  .times-scroll { display:flex; overflow-x:auto; padding:5px 0; gap:8px; }
  .time-box { background:var(--box); border-radius:12px; padding:13px 18px; border:1.5px solid transparent; color:var(--white); font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .time-box.active { border-color:var(--gold); background:#2d2d2d; color:var(--gold); }
  .warning { color:#888; font-size:14px; margin-top:5px; line-height:20px; }
  .admin-title { color:var(--gold); font-size:22px; font-weight:bold; margin-bottom:20px; }
  .dashboard-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .logout { background:var(--box); border:1px solid var(--line); color:var(--gold); font-size:12px; font-weight:bold; padding:8px 12px; border-radius:8px; cursor:pointer; }
  .admin-item { background:#222; padding:15px; border-radius:12px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--line); gap:10px; }
  .client-name { color:var(--gold); font-size:17px; font-weight:bold; margin-bottom:8px; }
  .admin-info { color:#ddd; font-size:13px; margin-bottom:4px; }
  .delete-btn { border:1px solid #ff4d4d; background:none; border-radius:8px; padding:10px; font-size:18px; cursor:pointer; }
  .empty { padding:25px; text-align:center; color:#888; font-size:15px; }
  .gallery-full { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:14px; margin-bottom:14px; display:block; }
  .gallery-row { display:flex; background:#222; padding:12px; border-radius:12px; margin-bottom:12px; border:1px solid var(--line); gap:12px; align-items:center; }
  .gallery-thumb { width:110px; height:140px; object-fit:cover; border-radius:10px; }
  .gallery-actions { flex:1; display:flex; flex-direction:column; gap:10px; }
  .screen { display:none; }
  .screen.active { display:block; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal-overlay.show { display:flex; }
  .modal { background:var(--card); border-radius:16px; padding:24px; max-width:400px; width:100%; }
  .modal h3 { color:var(--gold); margin-bottom:12px; }
  .modal p { color:#ddd; font-size:14px; margin-bottom:20px; line-height:20px; word-break:break-all; }
  .modal-buttons { display:flex; gap:10px; }
  .modal-buttons button { flex:1; padding:12px; border-radius:10px; border:none; cursor:pointer; font-weight:bold; }
  .modal-cancel { background:var(--box); color:var(--gray); }
  .modal-ok { background:var(--gold); color:#111; }
  .modal-ok.danger { background:#ff4d4d; color:#fff; }
  .settings-card { display:flex; align-items:center; gap:14px; width:100%; background:var(--box); border:1.5px solid var(--gold); border-radius:14px; padding:18px; margin-bottom:14px; color:var(--white); cursor:pointer; text-align:start; }
  .sc-icon { font-size:30px; }
  .sc-text { display:flex; flex-direction:column; gap:4px; flex:1; }
  .sc-title { color:var(--gold); font-size:18px; font-weight:bold; }
  .sc-sub { color:var(--gray); font-size:13px; line-height:18px; }
  .phone-row { display:flex; gap:8px; margin-bottom:12px; align-items:stretch; direction:ltr; }
  .phone-row .input { margin-bottom:0; direction:ltr; text-align:left; flex:1; min-width:0; }
  .country-btn { background:var(--box); color:var(--white); border:1px solid var(--line); border-radius:10px; padding:0 12px; font-size:16px; cursor:pointer; white-space:nowrap; min-width:104px; }
  .country-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:flex-end; justify-content:center; z-index:110; }
  .country-overlay.show { display:flex; }
  .country-sheet { background:var(--card); border-radius:20px 20px 0 0; width:100%; max-width:560px; height:78vh; display:flex; flex-direction:column; padding:16px; }
  .country-head { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .country-head .input { margin-bottom:0; flex:1; }
  .country-close { background:var(--box); border:1px solid var(--line); color:var(--gold); border-radius:10px; padding:0 14px; font-size:18px; cursor:pointer; align-self:stretch; }
  .country-list { overflow-y:auto; flex:1; }
  .country-item { display:flex; align-items:center; gap:12px; width:100%; background:none; border:none; border-bottom:1px solid var(--line); color:var(--white); padding:13px 6px; font-size:15px; cursor:pointer; text-align:start; }
  .country-item.active { color:var(--gold); }
  .country-flag { font-size:22px; }
  .country-name { flex:1; }
  .country-dial { color:var(--gray); direction:ltr; }
  .workers-row { display:flex; overflow-x:auto; gap:12px; padding:10px 4px; }
  .worker-circle { min-width:80px; display:flex; flex-direction:column; align-items:center; cursor:pointer; }
  .worker-photo { width:70px; height:70px; border-radius:50%; object-fit:cover; border:2px solid transparent; background:#333; }
  .worker-circle.active .worker-photo { border-color:var(--gold); }
  .worker-circle.busy .worker-photo { border-color:#ff4d4d; opacity:0.5; }
  .worker-name { color:var(--gray); font-size:12px; margin-top:6px; font-weight:600; text-align:center; }
  .worker-circle.active .worker-name { color:var(--gold); }
  .worker-circle.busy .worker-name { color:#ff4d4d; }
  .qr-box { background:#fff; padding:16px; border-radius:14px; text-align:center; margin-top:14px; }
  .qr-box img { width:200px; height:200px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tab { flex:1; padding:10px; background:var(--box); border:none; border-radius:10px; color:var(--gray); font-size:14px; font-weight:600; cursor:pointer; }
  .tab.active { background:var(--gold); color:#111; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="logo" id="logoText">BARBER RESERVE</div>
      <div class="subtitle" id="subText"></div>
    </div>
    <button class="admin-trigger" id="adminTrigger">⚙️</button>
  </div>

  <!-- HOME -->
  <div class="card screen active" id="screen-home">
    <button class="lang-box" id="langBox">
      <span class="gray" id="labelText"></span>
      <span class="gold" id="langName"></span>
    </button>
    <div class="language-menu" id="langMenu" style="display:none"></div>

    <img class="hero-image" id="heroImg" alt="barber" style="visibility:hidden">

    <div class="barber-name" id="shopName">Barber</div>
    <div class="location" id="locText"></div>

    <div class="line"></div>
    <div class="section-title" id="titleText"></div>
    <div id="servicesList"></div>

    <button class="btn-secondary" id="galleryBtn"></button>

    <div class="line"></div>
    <div class="working-hours" id="workingHours"></div>

    <button class="btn" id="nextBtn"></button>
  </div>

  <!-- BOOKING -->
  <div class="card screen" id="screen-booking">
    <button class="back" data-goto="home"></button>
    
    <div id="workersSection" style="display:none">
      <div class="section-title-small" id="wLabel"></div>
      <div class="workers-row" id="workersRow"></div>
    </div>

    <div class="section-title-small" id="cdLabel"></div>
    <input class="input" id="inpName" type="text" maxlength="80" autocomplete="name">
    <div class="phone-row">
      <button type="button" class="country-btn" id="countryBtn"></button>
      <input class="input" id="inpPhone" type="tel" inputmode="tel" maxlength="20" autocomplete="tel-national">
    </div>
    
    <div class="line"></div>
    <div class="section-title-small" id="dLabel"></div>
    <div class="month-box" id="bookingMonth"></div>
    <div class="days-scroll" id="bookingDays"></div>
    <div id="bookingHolidayMsg"></div>
    <div class="section-title-small" id="tLabel"></div>
    <div id="timesArea"></div>
    <button class="btn" id="confirmBtn"></button>
  </div>

  <!-- GALLERY (customers) -->
  <div class="card screen" id="screen-gallery">
    <button class="back" data-goto="home"></button>
    <div class="admin-title" id="galleryTitle"></div>
    <div id="galleryList"></div>
  </div>

  <!-- SETTINGS HUB -->
  <div class="card screen" id="screen-settings">
    <button class="back" data-goto="home"></button>
    <div class="admin-title">⚙️ Settings</div>
    <button class="settings-card" id="goSignup">
      <span class="sc-icon">📝</span>
      <span class="sc-text"><span class="sc-title">Sign Up (New Barber)</span><span class="sc-sub">Create your own account</span></span>
    </button>
    <button class="settings-card" id="goLogin">
      <span class="sc-icon">🔐</span>
      <span class="sc-text"><span class="sc-title">Login (Barber)</span><span class="sc-sub">Access your dashboard</span></span>
    </button>
  </div>

  <!-- SIGN UP -->
  <div class="card screen" id="screen-signup">
    <button class="back" data-goto="settings"></button>
    <div class="admin-title">📝 Sign Up</div>
    <input class="input" id="suName" type="text" placeholder="Full name">
    <input class="input" id="suShop" type="text" placeholder="Shop name">
    <input class="input" id="suEmail" type="email" placeholder="Email">
    <input class="input" id="suPassword" type="password" placeholder="Password (min 6)">
    <button class="btn" id="signupBtn">CREATE ACCOUNT</button>
    <p id="suMsg" style="color:var(--gold);margin-top:12px;font-size:14px;text-align:center"></p>
  </div>

  <!-- LOGIN -->
  <div class="card screen" id="screen-login">
    <button class="back" data-goto="settings"></button>
    <div class="admin-title">🔐 Login</div>
    <input class="input" id="blEmail" type="email" placeholder="Email">
    <input class="input" id="blPassword" type="password" placeholder="Password">
    <button class="btn" id="loginBtn">LOGIN</button>
    <button class="btn-secondary" id="forgotBtn">Forgot password?</button>
    <p id="blMsg" style="color:var(--gold);margin-top:12px;font-size:14px;text-align:center"></p>
  </div>

  <!-- RESET -->
  <div class="card screen" id="screen-reset">
    <button class="back" data-goto="login"></button>
    <div class="admin-title">Reset password</div>
    <input class="input" id="rpEmail" type="email" placeholder="Email">
    <button class="btn" id="resetBtn">SEND RESET LINK</button>
    <p id="rpMsg" style="color:var(--gold);margin-top:12px;font-size:14px;text-align:center"></p>
  </div>

  <!-- NEW PASSWORD -->
  <div class="card screen" id="screen-newpass">
    <div class="admin-title">New password</div>
    <input class="input" id="npPassword" type="password" placeholder="New password">
    <button class="btn" id="newpassBtn">SAVE</button>
  </div>

  <!-- BARBER DASHBOARD -->
  <div class="card screen" id="screen-barber">
    <div class="dashboard-header">
      <div class="admin-title" style="margin-bottom:0">My Dashboard</div>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>
    <div class="line"></div>
    <div class="admin-info">📧 <span id="bdEmail"></span></div>
    <div class="admin-info">🏪 <span id="bdShop"></span></div>
    
    <div class="line"></div>
    <div class="section-title-small">👥 My Team (Workers)</div>
    <div class="workers-row" id="bdWorkersRow"></div>
    <button class="btn-secondary" id="addWorkerBtn">➕ Add Worker</button>
    
    <div class="line"></div>
    <button class="btn-secondary" id="bdEditCenter">🛠️ Edit Center (Services & Photos)</button>
    <button class="btn-secondary" id="bdGallery">🖼️ My Work Photos</button>
    
    <div class="line"></div>
    <div class="section-title-small">🔗 Share with clients</div>
    <button class="btn-secondary" id="bdShare">📋 Copy my public link</button>
    <div class="qr-box">
      <img id="bdQR" alt="QR">
    </div>
    
    <div class="line"></div>
    <button class="btn-secondary" id="bdPassword">🔑 Change password</button>
    
    <div class="line"></div>
    <div class="section-title-small">📅 Holidays (tap to toggle)</div>
    <div class="month-box" id="bdMonth"></div>
    <div class="days-scroll" id="bdDays"></div>
    
    <div class="line"></div>
    <div class="section-title-small">📋 My Bookings</div>
    <div id="bdBookings"></div>
  </div>

  <!-- CHANGE PASSWORD -->
  <div class="card screen" id="screen-changepass">
    <button class="back" data-goto="barber"></button>
    <div class="admin-title">Change password</div>
    <input class="input" id="cpPassword" type="password" placeholder="New password">
    <button class="btn" id="cpBtn">SAVE</button>
  </div>

  <!-- EDIT CENTER -->
  <div class="card screen" id="screen-editcenter">
    <button class="back" data-goto="barber"></button>
    <div class="admin-title">🛠️ Edit Center</div>

    <div class="section-title-small">🖼️ Cover Image</div>
    <img class="hero-image" id="ecHeroPreview" alt="" style="visibility:hidden">
    <input type="range" class="input" id="ecHeroPos" min="0" max="100" value="50" style="padding:8px">
    <button class="btn-secondary" id="ecHeroChange">📷 Change Cover Image</button>
    <input type="file" id="ecHeroInput" accept="image/*" style="display:none">

    <div class="line"></div>
    <div class="section-title-small">✂️ Services</div>
    <div id="ecServices"></div>
    <button class="btn-secondary" id="ecAddService">➕ Add Service</button>
  </div>

  <!-- ADMIN GALLERY -->
  <div class="card screen" id="screen-admingallery">
    <button class="back" data-goto="barber"></button>
    <div class="admin-title">🖼️ My Work Photos</div>
    <button class="btn-secondary" id="agAdd">📷 Add Photo</button>
    <input type="file" id="agInput" accept="image/*" style="display:none">
    <div class="line"></div>
    <div id="agList"></div>
  </div>

  <!-- ADD/EDIT WORKER -->
  <div class="card screen" id="screen-worker">
    <button class="back" data-goto="barber"></button>
    <div class="admin-title" id="workerTitle">Add Worker</div>
    <img class="hero-image" id="wPhotoPreview" alt="" style="visibility:hidden">
    <button class="btn-secondary" id="wPhotoBtn">📷 Photo</button>
    <input type="file" id="wPhotoInput" accept="image/*" style="display:none">
    <input class="input" id="wName" type="text" placeholder="Worker name" style="margin-top:14px">
    <button class="btn" id="wSave">SAVE WORKER</button>
  </div>

</div>

<!-- Country picker -->
<div class="country-overlay" id="countryOverlay">
  <div class="country-sheet">
    <div class="country-head">
      <input class="input" id="countrySearch" type="text" autocomplete="off" placeholder="Search">
      <button type="button" class="country-close" id="countryClose">✕</button>
    </div>
    <div class="country-list" id="countryList"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalMsg"></p>
    <div class="modal-buttons">
      <button class="modal-cancel" id="modalCancel">Cancel</button>
      <button class="modal-ok" id="modalOk">OK</button>
    </div>
  </div>
</div>

const futureDates = (() => {
  const out = []; const today = new Date(); today.setHours(0,0,0,0);
  for (let i=0;i<BOOKING_DAYS_AHEAD;i++){ const d=new Date(today); d.setDate(today.getDate()+i); out.push(d); }
  return out;
})();

/* ============ HELPERS ============ */
const pad = n => String(n).padStart(2,'0');
const dateToKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const keyToDate = k => { const [y,m,dd]=k.split('-').map(Number); return new Date(y,m-1,dd); };
const timeToMinutes = v => { const [h,m]=v.split(':').map(Number); return h*60+m; };
const minutesToTime = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getShortDayName = d => d.toLocaleDateString(locale(), {weekday:'short'});
const t = () => translations[lang];
const locale = () => locales[lang];

function getMonthLabel(scrollEl){
  const itemW=78, left=scrollEl?scrollEl.scrollLeft:0, width=scrollEl?scrollEl.clientWidth:300;
  const s=Math.max(0,Math.min(futureDates.length-1,Math.floor(Math.abs(left)/itemW)));
  const e=Math.max(s,Math.min(futureDates.length-1,Math.floor((Math.abs(left)+width-1)/itemW)));
  const seen=[];
  for(let i=s;i<=e;i++){ const d=futureDates[i]; const k=`${d.getFullYear()}-${d.getMonth()}`; if(!seen.some(x=>x.k===k)) seen.push({k,d}); }
  if(!seen.length) return '';
  if(seen.length===1) return seen[0].d.toLocaleDateString(locale(),{month:'long',year:'numeric'});
  return seen.map(x=>x.d.toLocaleDateString(locale(),{month:'long',year:'numeric'})).join(' / ');
}
const isHoliday = k => holidayDates.includes(k);

/* ============ MODAL ============ */
function showAlert(title, msg, okText, onOk){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMsg').textContent = msg;
  const cancelBtn = document.getElementById('modalCancel');
  const okBtn = document.getElementById('modalOk');
  okBtn.textContent = okText || t().btnOk;
  okBtn.className = 'modal-ok';
  cancelBtn.style.display = 'none';
  document.getElementById('modalOverlay').classList.add('show');
  okBtn.onclick = () => { document.getElementById('modalOverlay').classList.remove('show'); onOk && onOk(); };
}
function showConfirm(title, msg, okText, onOk){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMsg').textContent = msg;
  const cancelBtn = document.getElementById('modalCancel');
  const okBtn = document.getElementById('modalOk');
  cancelBtn.textContent = t().cancel;
  okBtn.textContent = okText;
  okBtn.className = 'modal-ok danger';
  cancelBtn.style.display = '';
  document.getElementById('modalOverlay').classList.add('show');
  cancelBtn.onclick = () => { document.getElementById('modalOverlay').classList.remove('show'); };
  okBtn.onclick = () => { document.getElementById('modalOverlay').classList.remove('show'); onOk && onOk(); };
}
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target.id === 'modalOverlay') e.target.classList.remove('show');
});

/* ============ SCREEN ============ */
function setScreen(s){
  screen = s;
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  const el = document.getElementById('screen-'+s);
  if (el) el.classList.add('active');
  window.scrollTo(0,0);
  if (s==='home') renderHome();
  if (s==='booking') renderBooking();
  if (s==='gallery') renderGallery();
  if (s==='barber') renderBarberDashboard();
  if (s==='editcenter') renderEditCenter();
  if (s==='admingallery') renderAdminGallery();
  if (s==='worker') renderWorkerScreen();
  if (s==='settings') renderSettings();
}

  /* ============ SUPABASE LOADERS ============ */
async function loadBusy(){
  if (!viewingBarberId){ busySlots=[]; return false; }
  const { data, error } = await sb.rpc('bb_public_busy', { p_barber_id: viewingBarberId });
  if (error){ console.error(error); return false; }
  busySlots = (data||[]).map(r=>({dateKey:r.date_key, start:r.start_min, duration:r.duration, workerId:r.worker_id}));
  return true;
}
async function loadHolidays(){
  if (!viewingBarberId){ holidayDates=[]; return false; }
  const { data, error } = await sb.rpc('bb_public_holidays', { p_barber_id: viewingBarberId });
  if (error){ console.error(error); return false; }
  holidayDates = (data||[]).map(r=>r.date_key).sort();
  return true;
}
async function loadPhotos(){
  if (!viewingBarberId){ galleryPhotos=[]; return false; }
  const { data, error } = await sb.from('gallery').select('id,url,sort').eq('barber_id', viewingBarberId).order('sort');
  if (error){ console.error(error); return false; }
  galleryPhotos = (data||[]).map(r=>({id:String(r.id), url:r.url}));
  return true;
}
async function loadBarberConfig(){
  if (!viewingBarberId) return null;
  const { data, error } = await sb.rpc('bb_public_get_barber', { p_barber_id: viewingBarberId });
  if (error){ console.error(error); return null; }
  currentBarberData = data;
  workers = (data && data.workers) || [];
  return data;
}
async function loadWorkers(){
  if (!currentBarberId){ workers=[]; return false; }
  const { data, error } = await sb.from('workers')
    .select('*').eq('barber_id', currentBarberId).eq('is_active', true).order('sort').order('id');
  if (error){ console.error(error); return false; }
  workers = (data||[]).map(w => ({ id: w.id, name: w.name, photo_url: w.photo_url, sort: w.sort }));
  return true;
}
async function loadAdminBookings(){
  if (!currentBarberId){ adminBookings=[]; return false; }
  const { data, error } = await sb.from('bookings')
    .select('*, workers(name)').eq('barber_id', currentBarberId).eq('status','confirmed')
    .gte('date_key', dateToKey(new Date()))
    .order('date_key').order('start_min');
  if (error){ console.error(error); return false; }
  adminBookings = (data||[]).map(r=>({
    id:r.id, clientName:r.client_name, clientPhone:r.client_phone,
    serviceName:r.service_name, dateKey:r.date_key,
    startTime:minutesToTime(r.start_min), duration:r.duration,
    workerName: r.workers ? r.workers.name : null
  }));
  return true;
}
async function loadSettings(){
  if (!viewingBarberId) return null;
  const { data, error } = await sb.from('barber_settings').select('key,value').eq('barber_id', viewingBarberId);
  if (error){ console.error(error); return null; }
  const settings = {};
  (data||[]).forEach(r => settings[r.key] = r.value);
  return settings;
}

function isWorkerBusy(workerId, dateKey, timeStr, service){
  if (!service || !timeStr) return false;
  const start = timeToMinutes(timeStr);
  const dur = Number(service.duration);
  const end = start + dur;
  return busySlots.some(b => 
    b.dateKey === dateKey 
    && b.workerId === workerId 
    && start < (b.start + b.duration) 
    && end > b.start
  );
}

function generateAvailableTimes(){
  if (!selectedDateKey || !selectedService) return [];
  if (isHoliday(selectedDateKey)) return [];
  
  const opening = timeToMinutes(OPENING_TIME), closing = timeToMinutes(CLOSING_TIME);
  const dur = Number(selectedService.duration);
  const now = new Date();
  const isToday = selectedDateKey === dateToKey(now);
  const nowMin = now.getHours()*60 + now.getMinutes();
  const out = [];
  
  for (let start=opening; start+dur<=closing; start+=5){
    if (isToday && start <= nowMin) continue;
    const cand = minutesToTime(start);
    const end = start + dur;
    
    let overlap;
    if (workers.length > 0){
      // فلترة حسب العامل المختار
      overlap = busySlots.some(b => 
        b.dateKey === selectedDateKey 
        && b.workerId === selectedWorkerId 
        && start < (b.start + b.duration) 
        && end > b.start
      );
    } else {
      // حلاق فردي
      overlap = busySlots.some(b => 
        b.dateKey === selectedDateKey 
        && (b.workerId === null || b.workerId === undefined)
        && start < (b.start + b.duration) 
        && end > b.start
      );
    }
    if (!overlap) out.push(cand);
  }
  return out;
}

/* ============ IMAGE COMPRESS + UPLOAD ============ */
async function compressImage(file, maxSize = 1600, quality = 0.85){
  const img = await createImageBitmap(file);
  let w = img.width, h = img.height;
  if (w > maxSize || h > maxSize){
    const r = Math.min(maxSize / w, maxSize / h);
    w = Math.round(w * r); h = Math.round(h * r);
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
  return new File([blob], 'photo.jpg', { type: 'image/jpeg' });
}

async function uploadToStorage(file, prefix = 'img'){
  const compressed = await compressImage(file);
  const fileName = currentBarberId + '/' + prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.jpg';
  const { error } = await sb.storage.from(BUCKET).upload(fileName, compressed, { 
    cacheControl:'3600', upsert:false, contentType:'image/jpeg' 
  });
  if (error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(fileName).data.publicUrl;
}

const COUNTRY_DATA = 'AF:93,AL:355,DZ:213,AS:1684,AD:376,AO:244,AI:1264,AG:1268,AR:54,AM:374,AW:297,AU:61,AT:43,AZ:994,BS:1242,BH:973,BD:880,BB:1246,BY:375,BE:32,BZ:501,BJ:229,BM:1441,BT:975,BO:591,BA:387,BW:267,BR:55,IO:246,VG:1284,BN:673,BG:359,BF:226,BI:257,KH:855,CM:237,CA:1,CV:238,KY:1345,CF:236,TD:235,CL:56,CN:86,CO:57,KM:269,CG:242,CD:243,CK:682,CR:506,CI:225,HR:385,CU:53,CW:599,CY:357,CZ:420,DK:45,DJ:253,DM:1767,DO:1809,EC:593,EG:20,SV:503,GQ:240,ER:291,EE:372,SZ:268,ET:251,FK:500,FO:298,FJ:679,FI:358,FR:33,GF:594,PF:689,GA:241,GM:220,GE:995,DE:49,GH:233,GI:350,GR:30,GL:299,GD:1473,GP:590,GU:1671,GT:502,GN:224,GW:245,GY:592,HT:509,HN:504,HK:852,HU:36,IS:354,IN:91,ID:62,IR:98,IQ:964,IE:353,IL:972,IT:39,JM:1876,JP:81,JO:962,KZ:7,KE:254,KI:686,XK:383,KW:965,KG:996,LA:856,LV:371,LB:961,LS:266,LR:231,LY:218,LI:423,LT:370,LU:352,MO:853,MG:261,MW:265,MY:60,MV:960,ML:223,MT:356,MH:692,MQ:596,MR:222,MU:230,YT:262,MX:52,FM:691,MD:373,MC:377,MN:976,ME:382,MS:1664,MA:212,MZ:258,MM:95,NA:264,NR:674,NP:977,NL:31,NC:687,NZ:64,NI:505,NE:227,NG:234,NU:683,KP:850,MK:389,MP:1670,NO:47,OM:968,PK:92,PW:680,PS:970,PA:507,PG:675,PY:595,PE:51,PH:63,PL:48,PT:351,PR:1787,QA:974,RE:262,RO:40,RU:7,RW:250,WS:685,SM:378,ST:239,SA:966,SN:221,RS:381,SC:248,SL:232,SG:65,SX:1721,SK:421,SI:386,SB:677,SO:252,ZA:27,KR:82,SS:211,ES:34,LK:94,SD:249,SR:597,SE:46,CH:41,SY:963,TW:886,TJ:992,TZ:255,TH:66,TL:670,TG:228,TK:690,TO:676,TT:1868,TN:216,TR:90,TM:993,TC:1649,TV:688,UG:256,UA:380,AE:971,GB:44,US:1,UY:598,UZ:998,VU:678,VE:58,VN:84,VI:1340,WF:681,YE:967,ZM:260,ZW:263,PM:508,SH:290,KN:1869,LC:1758,VC:1784';
const PREFERRED = ['ES','DZ','MA','FR','DE','GB','IT','PT','NL','BE','CH','TN','US'];
const COUNTRIES = {};
COUNTRY_DATA.split(',').forEach(p => { const [iso, dial] = p.split(':'); COUNTRIES[iso] = { iso, dial }; });
const countryList = Object.values(COUNTRIES);
const byDial = {};
PREFERRED.forEach(i => { const c = COUNTRIES[i]; if (c && !byDial[c.dial]) byDial[c.dial] = c; });
countryList.forEach(c => { if (!byDial[c.dial]) byDial[c.dial] = c; });
const flagOf = iso => iso.replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
let phoneCountry = 'ES';
let _dn = null, _dnLang = null;
function countryName(iso){
  try {
    if (_dnLang !== lang){ _dn = new Intl.DisplayNames([locale()], { type:'region' }); _dnLang = lang; }
    return _dn.of(iso) || iso;
  } catch(e){ return iso; }
}
const normTxt = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function detectDial(digits){
  for (let n = 4; n >= 1; n--){ const d = digits.slice(0, n); if (byDial[d]) return { dial: d, rest: digits.slice(n) }; }
  return null;
}
function nationalDigits(){
  let d = document.getElementById('inpPhone').value.replace(/\D/g, '');
  if (phoneCountry !== 'IT') d = d.replace(/^0+/, '');
  return d;
}
function isPhoneValid(){
  const c = COUNTRIES[phoneCountry];
  const d = nationalDigits();
  if (!d) return false;
  // التحقق حسب الدولة
  if (c.iso === 'ES') return /^[6-9]\d{8}$/.test(d);
  if (c.iso === 'MA') return /^[5-7]\d{8}$/.test(d);
  if (c.iso === 'DZ') return /^[5-7]\d{8}$/.test(d);
  if (c.iso === 'FR') return /^[1-9]\d{8}$/.test(d);
  if (c.iso === 'DE') return /^[1-9]\d{9,10}$/.test(d);
  if (c.iso === 'US' || c.iso === 'CA') return /^[2-9]\d{9}$/.test(d);
  if (c.iso === 'GB') return /^[1-9]\d{9}$/.test(d);
  // القاعدة العامة: 6-14 رقم للنظام الدولي
  return d.length >= 6 && (c.dial.length + d.length) <= 15;
}
function syncPhone(){
  const c = COUNTRIES[phoneCountry];
  const d = nationalDigits();
  phone = d ? '+' + c.dial + ' ' + d : '';
}
function renderCountryBtn(){
  const c = COUNTRIES[phoneCountry];
  document.getElementById('countryBtn').textContent = flagOf(c.iso) + ' +' + c.dial + ' ▾';
}
function normalizePhoneField(){
  const el = document.getElementById('inpPhone');
  const raw = el.value.trim();
  if (raw.startsWith('+') || raw.startsWith('00')){
    let digits = raw.replace(/\D/g, '');
    if (!raw.startsWith('+')) digits = digits.replace(/^00/, '');
    const hit = detectDial(digits);
    if (hit){ phoneCountry = byDial[hit.dial].iso; el.value = hit.rest; renderCountryBtn(); }
  }
  syncPhone();
}
function openCountryPicker(){
  const s = document.getElementById('countrySearch');
  s.value = ''; s.placeholder = t().searchCountry;
  renderCountryList('');
  document.getElementById('countryOverlay').classList.add('show');
}
function closeCountryPicker(){ document.getElementById('countryOverlay').classList.remove('show'); }
function renderCountryList(q){
  const list = document.getElementById('countryList');
  const nq = normTxt(q).replace(/^\+/, '').trim();
  const items = countryList.map(c => ({ iso: c.iso, dial: c.dial, name: countryName(c.iso) }));
  const pinned = PREFERRED.map(i => items.find(x => x.iso === i)).filter(Boolean);
  const rest = items.filter(x => !PREFERRED.includes(x.iso)).sort((a, b) => a.name.localeCompare(b.name, locale()));
  let all = [...pinned, ...rest];
  if (nq) all = all.filter(x => normTxt(x.name).includes(nq) || x.dial.startsWith(nq) || x.iso.toLowerCase() === nq);
  list.innerHTML = '';
  all.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'country-item' + (c.iso === phoneCountry ? ' active' : '');
    b.innerHTML = '<span class="country-flag">' + flagOf(c.iso) + '</span><span class="country-name">' + esc(c.name) + '</span><span class="country-dial">+' + c.dial + '</span>';
    b.onclick = () => { phoneCountry = c.iso; closeCountryPicker(); renderCountryBtn(); syncPhone(); updateConfirmState(); };
    list.appendChild(b);
  });
}

/* ============ BOOKING SUBMIT ============ */
async function handleFinalBooking(){
  if (submitting) return;
  normalizePhoneField();
  
  if (!name.trim() || !phone.trim() || !selectedDateKey || !time || !selectedService){
    showAlert('!', t().errF); return;
  }
  if (!isPhoneValid()){ showAlert('!', t().phoneInvalid); return; }
  if (workers.length > 0 && !selectedWorkerId){ showAlert('!', t().selectWorker); return; }
  
  submitting = true;
  document.getElementById('confirmBtn').classList.add('disabled');
  
  try {
    const params = {
      p_barber_id: viewingBarberId,
      p_name: name.trim(),
      p_phone: phone.trim(),
      p_service_id: Number(selectedService.id),
      p_date: selectedDateKey,
      p_start: timeToMinutes(time)
    };
    if (workers.length > 0 && selectedWorkerId){
      params.p_worker_id = selectedWorkerId;
    }
    
    const { data, error } = await sb.rpc('bb_public_create_booking', params);
    if (error){ console.error(error); showAlert('!', t().netErr); return; }
    if (!data || !data.ok){
      await Promise.all([loadBusy(), loadHolidays()]);
      time = null; renderBooking();
      showAlert('!', data && data.error === 'holiday' ? t().holidayNoBooking : t().timeTaken);
      return;
    }
    const selectedDate = keyToDate(selectedDateKey);
    const displayed = selectedDate.toLocaleDateString(locale(), {weekday:'long', day:'numeric', month:'long'});
    await loadBusy();
    showAlert(t().alertTitle, t().alertSuccess(name.trim(), selectedService.name, displayed, time), t().btnOk, () => {
      name=''; phone=''; selectedDateKey=null; time=null; selectedService=null; selectedWorkerId=null;
      document.getElementById('inpName').value='';
      document.getElementById('inpPhone').value='';
      setScreen('home');
    });
  } finally {
    submitting = false;
    if (screen === 'booking') updateConfirmState();
  }
}

/* ============ AUTH ============ */
async function loadCurrentBarber(){
  const { data: { user } } = await sb.auth.getUser();
  if (!user){ currentBarberId = null; currentBarber = null; return null; }
  currentBarberId = user.id;
  const { data } = await sb.from('barbers').select('*').eq('id', user.id).single();
  currentBarber = data;
  if (data){ viewingBarberId = data.id; }
  return data;
}

async function enterBarberMode(){
  const b = await loadCurrentBarber();
  if (!b){ alert('Profile not found. Try logging out and back in.'); return; }
  await Promise.all([loadWorkers(), loadHolidays(), loadPhotos(), loadAdminBookings()]);
  setScreen('barber');
}

async function doSignup(){
  const full_name = document.getElementById('suName').value.trim();
  const shop_name = document.getElementById('suShop').value.trim();
  const email = document.getElementById('suEmail').value.trim();
  const password = document.getElementById('suPassword').value;
  const msg = document.getElementById('suMsg');
  const tr = t();
  
  if (!full_name || !shop_name){ msg.textContent = tr.errNameShop; return; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.textContent = tr.errEmail; return; }
  if (password.length < 6){ msg.textContent = tr.errPass; return; }
  
  msg.textContent = 'Creating...';
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { full_name, shop_name } }
  });
  if (error){ 
    if (/already/i.test(error.message)) msg.textContent = tr.errEmailExists;
    else msg.textContent = error.message;
    return; 
  }
  msg.textContent = tr.signupSuccess;
  const { error: le } = await sb.auth.signInWithPassword({ email, password });
  if (le){ msg.textContent = '✓ Created. Please login.'; return; }
  await enterBarberMode();
}

async function doLogin(){
  const email = document.getElementById('blEmail').value.trim();
  const password = document.getElementById('blPassword').value;
  const msg = document.getElementById('blMsg');
  const tr = t();
  if (!email || !password){ msg.textContent = tr.errEmail; return; }
  msg.textContent = tr.loginSuccess;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ 
    if (/invalid/i.test(error.message)) msg.textContent = tr.wrongPassword;
    else msg.textContent = error.message;
    return; 
  }
  msg.textContent = '';
  await enterBarberMode();
}

async function doLogout(){
  await sb.auth.signOut();
  currentBarberId = null; currentBarber = null;
  setScreen('home');
}
